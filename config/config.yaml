# Default model (can be overridden per-node):
model:

  # Define the ANTHROPIC_API_KEY environment variable separately.
  provider: anthropic
  model: claude-opus-5
  max_tokens: 16000
  timeout: 900

# Prevent runaway agents:
max_tool_calls: 24
max_fix_attempts: 3
max_rows: 50
statement_timeout_ms: 5000

# Dollars one long-running command may spend before it stops — recording a
# corpus, running a search. 0 turns the ceiling off. Only enforceable where the
# backend reports what it charged, which today means OpenRouter.
max_spend: 5.0

# GEPA prompt optimization settings:
gepa:
  effort: max

# Per-node settings:
plan:
  effort: low
explore:
  effort: high
generate_sql:
  effort: high
fix:
  effort: high
extract:
  effort: low
answer:
  effort: low