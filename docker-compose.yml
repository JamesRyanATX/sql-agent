services:
  db:
    image: postgres:15-alpine
    container_name: flyline-db
    environment:
      POSTGRES_USER: flyline
      POSTGRES_PASSWORD: flyline
      POSTGRES_DB: flyline
    ports:
      - "5432:5432"
    volumes:
      - flyline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyline -d flyline"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  flyline-pgdata:
